<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a11cb"/>
      <stop offset="100%" stop-color="#2575fc"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- decorative geometric shapes -->
  <circle cx="1080" cy="60" r="90" fill="#ffffff" opacity="0.06"/>
  <circle cx="140" cy="250" r="120" fill="#ffffff" opacity="0.05"/>
  <rect x="60" y="220" width="34" height="34" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" transform="rotate(20 77 237)"/>
  <rect x="1090" y="200" width="26" height="26" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" transform="rotate(-15 1103 213)"/>
  <circle cx="1000" cy="240" r="6" fill="#ffffff" opacity="0.4"/>
  <circle cx="960" cy="70" r="4" fill="#ffffff" opacity="0.4"/>

  <!-- main text -->
  <text x="600" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    MUHAMMAD ALI AYUB
  </text>

  <line x1="440" y1="180" x2="760" y2="180" stroke="url(#lineGrad)" stroke-width="2"/>

  <text x="600" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e8ecff" text-anchor="middle" letter-spacing="2">
    SOFTWARE DEVELOPER · AUTOMATION ENTHUSIAST
  </text>
</svg>
